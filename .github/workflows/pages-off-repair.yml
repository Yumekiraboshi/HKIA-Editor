name: HKIA fixed OFF artifact privacy repair
on:
  workflow_dispatch:
    inputs:
      artifact_ref:
        description: 'Full commit SHA containing only approved site/ and site-manifest.json'
        required: true
        type: string
      target:
        description: 'Approved OFF distribution or OFF rollback'
        required: true
        type: choice
        options:
          - V33-SHELL266-V24-OFF
          - V33-SHELL266-TEST-WARNING
          - V33-SHELL266-DISCLOSURE
          - V33-FILE252-DIRTY
          - V33-FILE252
          - V33-ACHIEVEMENT-192
          - V33-ITEMS-192
          - V33-CATEGORY-192
          - V33-LOCALE-192
          - V33-SVELTE-6
          - V33-SVELTE
          - V33
          - V30
          - V29
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require isolated Actions publishing and OFF gates
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$ARTIFACT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET" == V33-SHELL266-V24-OFF || "$TARGET" == V33-SHELL266-TEST-WARNING || "$TARGET" == V33-SHELL266-DISCLOSURE || "$TARGET" == V33-FILE252-DIRTY || "$TARGET" == V33-FILE252 || "$TARGET" == V33-ACHIEVEMENT-192 || "$TARGET" == V33-ITEMS-192 || "$TARGET" == V33-CATEGORY-192 || "$TARGET" == V33-LOCALE-192 || "$TARGET" == V33-SVELTE-6 || "$TARGET" == V33-SVELTE || "$TARGET" == V33 || "$TARGET" == V30 || "$TARGET" == V29 ]]
          case "$TARGET" in
            V33-SHELL266-V24-OFF) test "$ARTIFACT_REF" = f749f84e0b529588ba30792cc9b570ff0b3c5aab ;;
            V33-SHELL266-TEST-WARNING) test "$ARTIFACT_REF" = 0680ed6e054f8d8c449b408eb8833e903d0ab2a3 ;;
            V33-SHELL266-DISCLOSURE) test "$ARTIFACT_REF" = eb209147320b501359437f49027b048738ee32a6 ;;
            V33-FILE252-DIRTY) test "$ARTIFACT_REF" = d916c4afc6abed2f1248e8727abbde026037a65b ;;
            V33-FILE252) test "$ARTIFACT_REF" = 58823fbf338c346d7c24ce12793c6bc477df70f1 ;;
            V33-ACHIEVEMENT-192) test "$ARTIFACT_REF" = abfebcbc53d1c4a765d609fecdfde3c00d6fb232 ;;
            V33-ITEMS-192) test "$ARTIFACT_REF" = 0936aa8533747383ae3e1fe7b5336925e29bdea8 ;;
            V33-CATEGORY-192) test "$ARTIFACT_REF" = 888e733bb4da56a47ddeb38d1a62f5b919bce102 ;;
            V33-LOCALE-192) test "$ARTIFACT_REF" = 575082d9532844714216e99046f086ad52d5d1c8 ;;
            V33-SVELTE-6) test "$ARTIFACT_REF" = 58c67c7fb23494d7ea0b549ff5f2ec82ce6309f2 ;;
            V33-SVELTE) test "$ARTIFACT_REF" = e11308e345368e4fec95c5b89136f9c7506967a7 ;;
            V33) test "$ARTIFACT_REF" = 8e2d8c790212fdcc1d3ab4ef96878e570f085b3d ;;
            V30) test "$ARTIFACT_REF" = b7e91df1e456ded1b50b4649797bf1b7df216717 ;;
            V29) test "$ARTIFACT_REF" = 15cacf59a0c24a1124edb3741816d300794b4cdb ;;
          esac
          test "$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type)" = workflow
          node --input-type=module -e 'import fs from "node:fs";const d=JSON.parse(fs.readFileSync("config/release-gates.json")).distribution;if(d.githubPages!=="OFF"||d.nativeSaveWriter!=="OFF_PENDING_FUNCTIONAL_BETA_SAFETY_QA")throw Error("OFF repair only; functional beta uses separate gate")'
          test "$(git hash-object scripts/00-verify-beta-artifact.mjs)" = 1adca007becc7b0a4edb422496da8cbb2a7f25a8
          test "$(git hash-object scripts/pages-artifact-policy.mjs)" = d6fc2872db11c301eef312574e3f4dfed16af138
          test "$(git hash-object scripts/lossless-webp.mjs)" = fedeae3bd28ddda39e10f46902a44cc74ae930e4
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.artifact_ref }}
          path: approved-artifact
          persist-credentials: false
          lfs: false
          submodules: false
      - name: Verify exact accepted OFF site, never repository root
        env:
          ARTIFACT_REF: ${{ inputs.artifact_ref }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          test "$(git -C approved-artifact rev-parse HEAD)" = "$ARTIFACT_REF"
          case "$TARGET" in
            V33-SHELL266-V24-OFF) expected=8d6c6fd8a359c84c15cc5625867ed2313f5a7a5388327e0bb6ba3489521a4689; source=e7ef5a6f7b2cc77a137fd9dd2592d7e77f03500b4805a014672ee9ff160fb10c ;;
            V33-SHELL266-TEST-WARNING) expected=63fa0aef150a62fe750820fea44e6096810de06dab096cb4dd728f9391f3e86b; source=d2292444f7556f44f172478f3986b9776e945884c5cd43f85db77c6d80de5611 ;;
            V33-SHELL266-DISCLOSURE) expected=4909216e92af5519dda631e315e4d069cac60e299f675a05dd35b5f11944d7a6; source=d2292444f7556f44f172478f3986b9776e945884c5cd43f85db77c6d80de5611 ;;
            V33-FILE252-DIRTY) expected=df4b1fa94bd3e25a81b56cc2a03f6e8b31a652a17ede96225fea311cc0ed61d8; source=bd08ca8b5786ed059fad57ca11f52dc396b53420575e758044d1d733ba41c318 ;;
            V33-FILE252) expected=6d58a4c8b72f79907729f549390702d6b619f4fe7229cf2a570d7859b9fad94d; source=6ff82ad86550b74ee43a2adc6870bfc8f907796ddbb64c0f5b05ce2507842cde ;;
            V33-ACHIEVEMENT-192) expected=f851536cf429d607550b9ac5e93fbf632f0ec140482442236fd728f412801a39; source=b2174ef03dce1d8da926325d49b1fbc48b478df9ef764368809e3f833bd2bfbd ;;
            V33-ITEMS-192) expected=6bb1fb2cb6d3897aca0f8a5380dd094efa41701b4377657730ae4db6f4a8bed0; source=ab1edbca5ba669c35b567ef4e985e7c63fdce980a9798ce8f8607d8e5fa402d8 ;;
            V33-CATEGORY-192) expected=625379c7b0b7be5bf8d6310f26b2bdc596db977715a16d94e388909bcc1442e6; source=38cd125891421943cfd5a7c09d8ad4ba1f4e198183f919dfdf49e339d25bbade ;;
            V33-LOCALE-192) expected=0f8dc85d85162689746723d0c28ef1bacd4b665f3259debe3509a057ced15078; source=f9192abf38ef920e325b746a8829c21810663f77923227a5f10bdac49ad176e4 ;;
            V33-SVELTE-6) expected=fe321492bc56aff7ff789130972673c002c0319aaabe19d2139bdcdcd5c2cddd; source=dbe11b26053e832370cdd3d79ebe69695c7acb6bf961d2404a6814c11b4d2272 ;;
            V33-SVELTE) expected=d3267ba7132df5a8d311e41fd25425255aecff3eabb68fccccf65a3f99db5c8b; source=ca0268e4d1d87586f7aeac774985cfd65d5cbd46fb15295e841acfa7fc1e2352 ;;
            V33) expected=137cc1cdc1dc783fa4cedadf3e16619a07c9cfa6f6559cb8d2f449b7603120db; source=78c21b5cd4a764a42e7ed429f17d6c696a92d53fdf97cb8a332eea3a5381e7c7 ;;
            V30) expected=564a5fc19b479931a616a3ce0fdc8f1c02b71b072fb84d9683cb5147029bf7f6; source=a829350378ecf342cad6e23ae6b32f58b71514e08ba0428144eaa486dc202a4a ;;
            V29) expected=859ea9296451be21ec114b0087542e9a6f477d96f486125c02660cff3ccd963d; source=aedb4cf63f7af9e7b95de684201b8bfe8ef3d421cf1ca98c724aa5f4ea385de0 ;;
            *) exit 1 ;;
          esac
          node scripts/00-verify-beta-artifact.mjs approved-artifact/site approved-artifact/site-manifest.json "$expected"
          EXPECTED_SOURCE="$source" TARGET="$TARGET" node --input-type=module -e 'import fs from "node:fs";const m=JSON.parse(fs.readFileSync("approved-artifact/site-manifest.json"));if(m.writer!=="OFF"||m.sourceSha256!==process.env.EXPECTED_SOURCE||m.entries!==(process.env.TARGET==="V33-SHELL266-V24-OFF"?4211:[ "V33-SHELL266-TEST-WARNING","V33-SHELL266-DISCLOSURE" ].includes(process.env.TARGET)?4209:["V33-FILE252-DIRTY","V33-FILE252"].includes(process.env.TARGET)?4194:process.env.TARGET==="V33-ACHIEVEMENT-192"?4179:process.env.TARGET==="V33-ITEMS-192"?4177:process.env.TARGET==="V33-CATEGORY-192"?4174:process.env.TARGET==="V33-LOCALE-192"?4173:process.env.TARGET==="V33-SVELTE-6"?4153:process.env.TARGET==="V33-SVELTE"?4152:4146)||m.webp!==4076||m.modules!==(process.env.TARGET==="V33-SHELL266-V24-OFF"?73:["V33-SHELL266-TEST-WARNING","V33-SHELL266-DISCLOSURE","V33-FILE252-DIRTY","V33-FILE252"].includes(process.env.TARGET)?71:process.env.TARGET==="V33-ACHIEVEMENT-192"?71:process.env.TARGET==="V33-ITEMS-192"?69:process.env.TARGET==="V33-CATEGORY-192"?66:process.env.TARGET==="V33-LOCALE-192"?65:process.env.TARGET==="V33-SVELTE-6"?61:process.env.TARGET==="V33-SVELTE"?60:55))throw Error("Unexpected OFF source or scope");if(Object.keys(m.files).some(p=>p.startsWith("coordination/")||p.startsWith("tests/")||p.startsWith(".github/")))throw Error("Internal path")'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: approved-artifact/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
